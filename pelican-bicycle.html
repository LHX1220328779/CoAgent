<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3efe3">
  <title>Pelican Ride</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f3efe3; }
    svg { display: block; width: 100%; height: 100%; pointer-events: none; }
    .line { stroke-linecap: round; stroke-linejoin: round; }
    .rider { animation: riding-bob 2.4s ease-in-out infinite; }
    .wing { animation: wing-rock 2.4s ease-in-out infinite; transform-origin: 610px 470px; }
    .scarf-end { animation: scarf-flutter 1.2s ease-in-out infinite; }
    .blink { animation: blink 6s linear infinite; transform-origin: 810px 283px; }
    .gull { animation: gull-float 4s ease-in-out infinite; }
    .gull.second { animation-delay: -2s; }
    @keyframes riding-bob {
      0%, 50%, 100% { transform: translateY(0); }
      25%, 75% { transform: translateY(3px); }
    }
    @keyframes wing-rock {
      0%, 50%, 100% { transform: rotate(0deg); }
      25%, 75% { transform: rotate(-1.5deg); }
    }
    @keyframes scarf-flutter {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blink {
      0%, 43%, 46%, 100% { transform: scaleY(1); }
      44%, 45% { transform: scaleY(0.08); }
    }
    @keyframes gull-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
  </style>

  <script>
    const farLeg = document.getElementById('far-leg');
    const farFoot = document.getElementById('far-foot');
    const farPedal = document.getElementById('far-pedal');
    const nearLeg = document.getElementById('near-leg');
    const nearLegLight = document.getElementById('near-leg-light');
    const nearFoot = document.getElementById('near-foot');
    const nearPedal = document.getElementById('near-pedal');
    const crank = document.getElementById('crank');

    function legPath(hipX, hipY, ankleX, ankleY) {
      const dx = ankleX - hipX;
      const dy = ankleY - hipY;
      const distance = Math.hypot(dx, dy);
      const upper = 120;
      const lower = 125;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + (along * dx + bend * dy) / distance;
      const kneeY = hipY + (along * dy - bend * dx) / distance;
      return `M${hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
    }

    function animateRide(time) {
      const angle = time * Math.PI * 2 / 2400;
      const pedalX = 704 + Math.cos(angle) * 47;
      const pedalY = 724 + Math.sin(angle) * 47;
      const backX = 704 - Math.cos(angle) * 47;
      const backY = 724 - Math.sin(angle) * 47;
      const bob = 1.5 - 1.5 * Math.cos(angle * 2);

      farLeg.setAttribute('d', legPath(650, 544 + bob, backX, backY - 6));
      farFoot.setAttribute('d', `M${backX - 12} ${backY - 3}Q${backX + 3} ${backY - 13} ${backX + 19} ${backY + 1}`);
      farPedal.setAttribute('d', `M${backX - 16} ${backY + 5}H${backX + 19}`);
      const nearPath = legPath(672, 549 + bob, pedalX, pedalY - 6);
      nearLeg.setAttribute('d', nearPath);
      nearLegLight.setAttribute('d', nearPath);
      nearFoot.setAttribute('d', `M${pedalX - 12} ${pedalY - 7}Q${pedalX + 2} ${pedalY - 13} ${pedalX + 13} ${pedalY - 6}L${pedalX + 25} ${pedalY + 2}Q${pedalX + 9} ${pedalY + 6} ${pedalX - 13} ${pedalY + 2}Z`);
      nearPedal.setAttribute('d', `M${pedalX - 16} ${pedalY + 7}H${pedalX + 23}`);
      crank.setAttribute('transform', `translate(704 724) rotate(${angle * 180 / Math.PI})`);
      requestAnimationFrame(animateRide);
    }

    requestAnimationFrame(animateRide);
  </script>
